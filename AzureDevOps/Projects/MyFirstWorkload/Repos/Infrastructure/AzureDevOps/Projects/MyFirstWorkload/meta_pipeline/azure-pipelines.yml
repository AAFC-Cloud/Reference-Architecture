parameters:
  - name: refreshState
    displayName: Refresh Terraform state before planning
    type: boolean
    default: true
  - name: destroyPlan
    displayName: Plan for Terraform destroy
    type: boolean
    default: false
  - name: terraformTargets
    displayName: Terraform target(s) (optional; leave as all for full plan)
    type: string
    default: all
  - name: refreshState
    displayName: Refresh Terraform state before planning
    type: boolean
    default: false

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - AzureDevOps/Projects/MyFirstWorkload/meta_pipeline/**
      - pipeline-templates/terraform-plan-and-apply/azure-pipelines.yml
      - pipeline-templates/terraform-plan-and-apply/install_terraform.sh
      - "**/*.tfvars.pipeline_registration"
    exclude:
      - AzureDevOps/Projects/MyFirstWorkload/meta_pipeline/**/*.md

extends:
  template: /pipeline-templates/terraform-plan-and-apply/azure-pipelines.yml
  parameters:
    pathInRepo: AzureDevOps/Projects/MyFirstWorkload/meta_pipeline
    serviceConnectionName: MyFirstWorkload-ServiceConnection
    environmentName: MyFirstWorkload-DEV
    agentPoolName: Teamy-Hub-AZDO-AgentPool-1-DEV-VMSS-Pool
    destroyPlan: ${{ parameters.destroyPlan }}
    terraformTargets: ${{ parameters.terraformTargets }}
    refreshState: ${{ parameters.refreshState }}
    terraformParallelism: 50
