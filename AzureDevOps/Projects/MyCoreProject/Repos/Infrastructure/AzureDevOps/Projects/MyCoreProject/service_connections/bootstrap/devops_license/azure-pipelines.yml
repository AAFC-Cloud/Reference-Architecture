trigger:
  branches:
    include:
      - main
  paths:
    include:
      - AzureDevOps/Projects/MyCoreProject/service_connections/bootstrap/devops_license/**
    exclude:
      - AzureDevOps/Projects/MyCoreProject/service_connections/bootstrap/devops_license/**/*.md

extends:
  template: /pipeline-templates/terraform-plan-and-apply/azure-pipelines.yml
  parameters:
    pathInRepo: AzureDevOps/Projects/MyCoreProject/service_connections/bootstrap/devops_license
    serviceConnectionName: MyCoreProject-Bootstrap-ServiceConnection
    environmentName: MyCoreProject-Core-Environment
    agentPoolName: MyAgentPool-01
