trigger:
  branches:
    include:
      - main
  paths:
    include:
      - AzureDevOps/Projects/MyCoreProject/environments/Main - SkipApproval/**
      - pipeline-templates/terraform-plan-and-apply/azure-pipelines.yml
      - pipeline-templates/terraform-plan-and-apply/install_terraform.sh
    exclude:
      - AzureDevOps/Projects/MyCoreProject/environments/Main - SkipApproval/**/*.md

extends:
  template: /pipeline-templates/terraform-plan-and-apply/azure-pipelines.yml
  parameters:
    pathInRepo: AzureDevOps/Projects/MyCoreProject/environments/Main - SkipApproval
    serviceConnectionName: MyCoreProject-Bootstrap-ServiceConnection
    environmentName: MyCoreProject-Core-Environment
    agentPoolName: Teamy-Hub-AZDO-AgentPool-1-DEV-VMSS-Pool
