parameters:
  - name: destroyPlan
    displayName: Plan for Terraform destroy
    type: boolean
    default: false
  - name: terraformTargets
    displayName: Terraform target(s) (optional; leave as all for full plan)
    type: string
    default: all
  - name: refreshState
    displayName: Refresh Terraform state before planning
    type: boolean
    default: true

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - AzureDevOps/Projects/MyCoreProject/service_connections/bootstrap/azure_rbac/**
    exclude:
      - AzureDevOps/Projects/MyCoreProject/service_connections/bootstrap/azure_rbac/**/*.md

extends:
  template: /pipeline-templates/terraform-plan-and-apply/azure-pipelines.yml
  parameters:
    pathInRepo: AzureDevOps/Projects/MyCoreProject/service_connections/bootstrap/azure_rbac
    serviceConnectionName: MyCoreProject-Bootstrap-ServiceConnection
    environmentName: MyCoreProject-Core-Environment
    agentPoolName: Teamy-Hub-AZDO-AgentPool-1-DEV-VMSS-Pool
    destroyPlan: ${{ parameters.destroyPlan }}
    terraformTargets: ${{ parameters.terraformTargets }}
    refreshState: ${{ parameters.refreshState }}
