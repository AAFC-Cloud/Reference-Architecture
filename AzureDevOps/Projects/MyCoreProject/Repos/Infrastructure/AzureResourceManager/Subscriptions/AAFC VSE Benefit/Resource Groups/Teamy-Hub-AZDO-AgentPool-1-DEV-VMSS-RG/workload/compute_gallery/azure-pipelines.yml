parameters:
  - name: destroyPlan
    displayName: Plan for Terraform destroy
    type: boolean
    default: false
  - name: terraformTargets
    displayName: Terraform target(s) (optional; leave as all for full plan)
    type: string
    default: all
  - name: refreshState
    displayName: Refresh Terraform state before planning
    type: boolean
    default: true

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - AzureResourceManager/Subscriptions/AAFC VSE Benefit/Resource Groups/Teamy-Hub-AZDO-AgentPool-1-DEV-VMSS-RG/workload/compute_gallery/**
    exclude:
      - AzureResourceManager/Subscriptions/AAFC VSE Benefit/Resource Groups/Teamy-Hub-AZDO-AgentPool-1-DEV-VMSS-RG/workload/compute_gallery/**/*.md

extends:
  template: /pipeline-templates/terraform-plan-and-apply/azure-pipelines.yml
  parameters:
    pathInRepo: AzureResourceManager/Subscriptions/AAFC VSE Benefit/Resource Groups/Teamy-Hub-AZDO-AgentPool-1-DEV-VMSS-RG/workload/compute_gallery
    serviceConnectionName: Teamy-Hub-AZDO-AgentPool-1-DEV-VMSS-MI-SC
    environmentName: MyCoreProject-Core-Environment
    agentPoolName: Teamy-Hub-AZDO-AgentPool-1-DEV-VMSS-Pool
    destroyPlan: ${{ parameters.destroyPlan }}
    terraformTargets: ${{ parameters.terraformTargets }}
    refreshState: ${{ parameters.refreshState }}
